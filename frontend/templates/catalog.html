{% extends "base.html" %}
{% from "_loading.html" import cards %}
{% block content %}
<section class="container model-catalog" aria-label="{{ catalog_title }} catalog">
  <div id="catalog-explorer" data-kind="{{ kind }}" data-title="{{ catalog_title }}" data-introduction="{{ introduction }}" data-share-label="{{ share_label }}" data-share-url="{{ url_for('submit_research') }}">
    <div class="loading-placeholder" role="status" aria-label="Loading {{ kind }} catalog">
      <div class="catalog-explorer-layout" aria-hidden="true">
        <div class="model-results-heading"><div class="catalog-heading-line"><div class="catalog-heading-title"><h1>{{ catalog_title }}<span class="maize-dot">.</span></h1><span class="catalog-heading-count">{{ entries | length }} of {{ entries | length }}</span></div><div class="loading-control"></div><div class="loading-control loading-sort"></div></div></div>
        <div class="catalog-filter-sidebar"><h2>Filters</h2><div class="loading-filters"></div></div>
        <div class="catalog-results">{{ cards(entries | length, 'model-grid') }}</div>
      </div>
    </div>
  </div>
  <script id="catalog-data" type="application/json">{{ entries | tojson }}</script>
  <noscript>
    <style>.loading-placeholder { display:none; }</style>
    <h1>{{ catalog_title }}</h1>
    <p>Enable JavaScript to search, filter, and sort the catalog.</p>
    <ul>{% for entry in entries %}<li><a href="{{ entry.detail_url }}">{{ entry.title }}</a> · {{ entry.task if kind == 'models' else entry.category }}<p>{{ entry.description }}</p></li>{% else %}<li>No {{ kind }} available yet.</li>{% endfor %}</ul>
  </noscript>
</section>
{% endblock %}
